<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#faf2d9">
    <title>レシピ制作室</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #4b3728; background: #faf2d9; }
        h1 { font-size: 1.4rem; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px 0; border-bottom: 1px solid #e8dbc0; }
        a { font-size: 1.1rem; text-decoration: none; color: #805638; }
        a:hover { color: #65432c; }
        .app-count { display: inline-grid; min-width: 22px; height: 22px; margin-left: 5px; place-items: center; border-radius: 50%; background: #805638; color: #fffdf6; font-size: 12px; }
    </style>
</head>
<body>
    <h1>レシピ制作室</h1>
    <ul id="appList"></ul>

    <script>
        // サーバーから .html ファイルの一覧を取得してリンクを表示する
        async function loadPages() {
            const response = await fetch('/api/pages');
            const files = await response.json();

            const list = document.getElementById('appList');
            if (files.length === 0) {
                list.innerHTML = '<li>public/ に .html ファイルがありません。</li>';
                return;
            }

            files.forEach(name => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = name;
                a.textContent = name === 'recipe.html'
                    ? 'レシピをつくる'
                    : name === 'my-list.html'
                        ? 'マイリスト'
                        : name === 'shopping-list.html'
                            ? '買い物リスト'
                            : name === 'meal-plan.html'
                                ? '週刊献立表'
                                : name;
                if (name === 'my-list.html' || name === 'shopping-list.html') {
                    const badge = document.createElement('span');
                    badge.className = 'app-count';
                    badge.dataset.countKind = name === 'my-list.html' ? 'saved' : 'shopping';
                    a.appendChild(badge);
                }
                li.appendChild(a);
                list.appendChild(li);
            });
            updateCounts();
        }

        function updateCounts() {
            document.querySelectorAll('[data-count-kind="saved"]').forEach((badge) => {
                badge.textContent = String(countSavedRecipes());
            });
            document.querySelectorAll('[data-count-kind="shopping"]').forEach((badge) => {
                badge.textContent = String(countPendingShoppingItems());
            });
        }

        function countSavedRecipes() {
            try {
                const saved = JSON.parse(localStorage.getItem('recipe-bookmarks-v1') || '[]');
                return Array.isArray(saved) ? saved.length : 0;
            } catch {
                return 0;
            }
        }

        function countPendingShoppingItems() {
            try {
                const items = JSON.parse(localStorage.getItem('recipe-shopping-list-v1') || '[]');
                return Array.isArray(items) ? items.filter(item => item && item.checked !== true).length : 0;
            } catch {
                return 0;
            }
        }

        window.addEventListener('storage', (event) => {
            if (event.key === 'recipe-bookmarks-v1' || event.key === 'recipe-shopping-list-v1') updateCounts();
        });

        loadPages();
    </script>
</body>
</html>
