<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f4ec">
    <title>買い物リスト | レシピ制作室</title>
    <link rel="stylesheet" href="recipe.css">
</head>
<body>
    <main class="app-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">YOUR SHOPPING LIST</p>
                <h1>買い物リスト<span>。</span></h1>
                <p class="hero-description">レシピの材料をまとめて、買うものをチェックできます。</p>
            </div>
            <div class="hero-actions">
                <a class="bookmark-nav back-nav" href="recipe.html">← レシピ制作室へ</a>
                <a class="bookmark-nav back-nav" href="my-list.html">♡ マイリスト</a>
                <div class="hero-mark" aria-hidden="true">🛒</div>
            </div>
        </header>

        <section class="shopping-section">
            <div class="results-heading">
                <div class="section-heading">
                    <span class="step-number">🛒</span>
                    <div>
                        <h2>買うもの <span id="itemSummary" class="saved-count"></span></h2>
                        <p>レシピの材料は、各レシピの「材料を買い物リストに追加」から登録できます。</p>
                    </div>
                </div>
            </div>

            <form id="itemForm" class="shopping-form">
                <label for="itemInput">買うものを追加</label>
                <div class="shopping-input-row">
                    <input id="itemInput" type="text" maxlength="120" placeholder="例：牛乳 1本" autocomplete="off">
                    <button class="shopping-submit-button" type="submit">追加</button>
                </div>
            </form>

            <div class="shopping-tools">
                <button id="removeCheckedButton" class="shopping-tool-button" type="button">チェック済みを削除</button>
                <button id="clearListButton" class="shopping-tool-button is-secondary" type="button">リストを空にする</button>
            </div>
            <ul id="shoppingItems" class="shopping-items"></ul>
            <p id="shoppingEmpty" class="empty-state" hidden>リストは空です。レシピから材料を追加するか、上の欄から入力してください。</p>
        </section>

        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
        <footer class="page-footer">おいしい時間を、いつもの食材から。</footer>
    </main>

    <script src="shopping-list.js"></script>
    <script>
        const itemForm = document.getElementById('itemForm');
        const itemInput = document.getElementById('itemInput');
        const shoppingItems = document.getElementById('shoppingItems');
        const shoppingEmpty = document.getElementById('shoppingEmpty');
        const itemSummary = document.getElementById('itemSummary');
        const removeCheckedButton = document.getElementById('removeCheckedButton');
        const clearListButton = document.getElementById('clearListButton');
        const statusEl = document.getElementById('status');
        let items = RecipeShoppingList.load();

        renderItems();

        itemForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const text = itemInput.value.trim();
            if (!text) {
                itemInput.focus();
                return;
            }
            if (items.some((item) => item.text.toLocaleLowerCase('ja') === text.toLocaleLowerCase('ja'))) {
                showStatus('その品目はすでにリストにあります。');
                return;
            }
            if (saveItems([RecipeShoppingList.createItem(text), ...items])) {
                itemInput.value = '';
                itemInput.focus();
                showStatus('買い物リストに追加しました。');
            }
        });

        removeCheckedButton.addEventListener('click', () => {
            const nextItems = items.filter((item) => !item.checked);
            if (nextItems.length !== items.length) saveItems(nextItems);
        });

        clearListButton.addEventListener('click', () => {
            if (!items.length || !window.confirm('買い物リストをすべて削除しますか？')) return;
            saveItems([]);
        });

        window.addEventListener('storage', (event) => {
            if (event.key === RecipeShoppingList.key) {
                items = RecipeShoppingList.load();
                renderItems();
            }
        });

        function saveItems(nextItems) {
            if (!RecipeShoppingList.save(nextItems)) {
                showStatus('買い物リストを保存できませんでした。ブラウザーの保存設定をご確認ください。');
                return false;
            }
            items = nextItems;
            renderItems();
            return true;
        }

        function renderItems() {
            shoppingItems.replaceChildren();
            const pendingCount = items.filter((item) => !item.checked).length;
            itemSummary.textContent = `${pendingCount}件 未購入 / ${items.length}件`;
            shoppingEmpty.hidden = items.length > 0;
            removeCheckedButton.disabled = pendingCount === items.length;
            clearListButton.disabled = items.length === 0;

            items.forEach((item) => {
                const row = document.createElement('li');
                row.className = `shopping-item${item.checked ? ' is-checked' : ''}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = item.checked;
                checkbox.setAttribute('aria-label', `${item.text}を購入済みにする`);
                checkbox.addEventListener('change', () => {
                    saveItems(items.map((savedItem) => savedItem.id === item.id
                        ? { ...savedItem, checked: checkbox.checked }
                        : savedItem));
                });

                const text = document.createElement('span');
                text.className = 'shopping-item-text';
                text.textContent = item.text;

                const details = document.createElement('div');
                details.className = 'shopping-item-details';
                details.appendChild(text);
                if (item.recipes.length) {
                    const source = document.createElement('small');
                    source.textContent = item.recipes.join('、');
                    details.appendChild(source);
                }

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'shopping-remove-button';
                removeButton.textContent = '削除';
                removeButton.setAttribute('aria-label', `「${item.text}」をリストから削除`);
                removeButton.addEventListener('click', () => {
                    saveItems(items.filter((savedItem) => savedItem.id !== item.id));
                });

                row.append(checkbox, details, removeButton);
                shoppingItems.appendChild(row);
            });
        }

        function showStatus(message) {
            statusEl.textContent = message;
            statusEl.hidden = false;
        }
    </script>
</body>
</html>
